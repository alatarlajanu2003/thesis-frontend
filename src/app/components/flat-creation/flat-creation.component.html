<section class="vh-100">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card bg-dark text-white" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">

                        <div class="mb-md-5 mt-md-4">

                            <h2 class="fw-bold mb-5 text-uppercase">New flat</h2>

                            <form [formGroup]="flatCreationForm">

                                <div class="form-outline form-white mb-4">
                                    <input type="text" class="form-control form-control-lg" formControlName="country"
                                        placeholder='Country' />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    <input type="text" class="form-control form-control-lg" formControlName="city"
                                        placeholder='City' />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    <input type="text" class="form-control form-control-lg"
                                        formControlName="postalCode" placeholder='Postal code' />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    <input type="email" class="form-control form-control-lg"
                                        formControlName="address" placeholder='Address' />
                                </div>

                                <button data-mdb-button-init data-mdb-ripple-init
                                    class="btn btn-outline-light btn-lg px-5" type="submit"
                                    (click)="createFlat()">Submit</button>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
