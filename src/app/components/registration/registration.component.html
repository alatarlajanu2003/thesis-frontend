<section class="vh-100">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card bg-dark text-white" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">

                        <div class="mb-md-5 mt-md-4">

                            <h2 class="fw-bold mb-5 text-uppercase">Registration</h2>

                            <form [formGroup]="registrationForm">

                                <div class="form-outline form-white mb-4">
                                    <input type="text" class="form-control form-control-lg" formControlName="firstName"
                                        placeholder='First name' />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    <input type="text" class="form-control form-control-lg" formControlName="lastName"
                                        placeholder='Last name' />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    <input type="text" class="form-control form-control-lg"
                                        formControlName="phoneNumber" placeholder='Phone number' />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    <input type="email" class="form-control form-control-lg"
                                        formControlName="emailAddress" placeholder='Email' />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    <input type="password" class="form-control form-control-lg"
                                        formControlName="password" placeholder='Password' />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    <input type="text" class="form-control form-control-lg"
                                        formControlName="preferredLanguage" placeholder='Preferred language' />
                                </div>

                                <button data-mdb-button-init data-mdb-ripple-init
                                    class="btn btn-outline-light btn-lg px-5" type="submit"
                                    (click)="register()">Submit</button>
                                    
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
