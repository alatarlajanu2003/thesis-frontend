<h2 class='mt-4'>Payments</h2>
<div class='table-responsive'>
    <table class="table">
        <thead class="thead-light">
            <tr align='center'>
                <th scope="col">Date</th>
                <th scope="col">Name</th>
                <th scope="col">Amount</th>
                <th scope="col">Payer</th>
                <th scope="col">Status</th>
                <th scope="col">Evidence(s)</th>
                <th scope="col" *ngIf="!isOwner">Evidence actions</th>
                <th scope="col">Payment actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let payment of paymentsWithPayerName; let i = index" align='center' class='align-middle'>
                <td>{{payment[0].paymentDate | date}}</td>
                <td>{{payment[0].paymentName}}</td>
                <td>{{payment[0].paymentAmount | currency:'HUF'}}</td>
                <td>{{payment[1]}}</td>
                <td>{{payment[0].isAcknowledged ? "Acknowledged" : "Pending"}}</td>
                <td>
                    <input *ngIf="payment[0].payerId == userId && !payment[0].imageName" type="file" (change)="onFileSelected($event)" style='margin-left: 70px'>
                    <a *ngIf="payment[0].imageName" (click)="openPopup(payment[0])" style='cursor: pointer;'>{{payment[0].imageName}}</a>
                </td>
                <td *ngIf="!isOwner" align='center'>
                    <button *ngIf="payment[0].payerId == userId && !payment[0].imageName" class="btn btn-dark" type="submit" (click)="uploadPaymentEvidence(payment[0].id)">Upload</button>
                    <button *ngIf="payment[0].payerId == userId && payment[0].imageName" class="btn btn-dark" type="submit" (click)="deletePaymentEvidence(payment[0].id)">Delete</button>
                </td>
                <td>
                    <div *ngIf="isOwner; then thenBlock else elseBlock"></div>
                    <ng-template #thenBlock>
                        <div (click)='acknowledgePaymentEvidence(payment[0].id)' *ngIf='!payment[0].isAcknowledged && payment[0].imageName' style='cursor: pointer;'><i class="bi bi-check" style='font-size: 25px;'></i></div>
                    </ng-template>
                    <ng-template #elseBlock>
                        <div (click)='deletePayment(payment[0].id)' *ngIf="payment[0].payerId == userId" style='cursor: pointer;' align='center'><i class="bi bi-trash" style='font-size: 25px;'></i></div>
                    </ng-template>
                </td>
            </tr>
        </tbody>
    </table>

    <button *ngIf="!isOwner" class="btn btn-dark px-5 mb-3" type="submit" [routerLink]="['/payment-creation', flatId]">Add new</button>
</div>

<div class="modal" tabindex="-1" role="dialog" [ngStyle]="{'display':displayStyle}">
    <div class="modal-dialog" role="document" style='width: fit-content;
    overflow: auto;'>
        <div class="modal-content" style='width: fit-content;
        overflow: auto;'>
            <div class="modal-body" style='width: fit-content;
            overflow: auto;'>
                <img src={{currentImageUrl}} style="width: 100%;" alt="">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" (click)="closePopup()">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>
