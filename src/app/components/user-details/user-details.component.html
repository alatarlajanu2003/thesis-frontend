<section class="vh-100">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card bg-dark text-white" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">

                        <div class="mb-md-5 mt-md-4">

                            <form [formGroup]="userDetailsForm">

                                <div class="form-outline form-white mb-4">
                                    First name <input type="text" class="form-control form-control-lg"
                                     formControlName="firstName" />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    Last name <input type="text" class="form-control form-control-lg" 
                                    formControlName="lastName" />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    Phone number <input type="text" class="form-control form-control-lg"
                                        formControlName="phoneNumber" />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    Email address <input type="email" class="form-control form-control-lg"
                                       readonly formControlName="emailAddress" />
                                </div>

                                <div class="form-outline form-white mb-4">
                                    Preferred language <input type="text" class="form-control form-control-lg"
                                        formControlName="preferredLanguage" />
                                </div>

                                <button
                                    class="btn btn-outline-light btn-lg px-5" type="submit"
                                    (click)="update()">Update</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
