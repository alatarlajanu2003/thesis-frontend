<div class="mt-4">
    <h2>Rented flats</h2>

    <div class="card-deck">
        <div class="card bg-light" style="width: 18rem; display:inline-block; margin: 10px; border: 2px solid black;"
            *ngFor="let rentedFlatWithOwners of rentedFlatsWithOwners">
            <div class='card-header'>
                <h5 class="card-title m-0">{{rentedFlatWithOwners[0].address}}</h5>
            </div>
            <div class="card-body">
                <div class="card-text">
                    <b>Owner:</b> {{rentedFlatWithOwners[1].firstName}} {{rentedFlatWithOwners[1].lastName}}
                </div><br>
                <a [routerLink]="['/flat-details', rentedFlatWithOwners[0].id]" class="btn btn-dark">Details</a>
            </div>
        </div>
    </div>

    <hr>

    <h2>Owned flats <button class="btn btn-light" style='border: 2px solid black;' [routerLink]='["/flat-creation"]'><i
                class="bi bi-plus" style='font-size: 25px'></i></button></h2>

    <div class="card-deck">
        <div class="card bg-light" style="width: 18rem; display:inline-block; margin: 10px; border: 2px solid black;"
            *ngFor="let ownedFlatWithTenants of ownedFlatsWithTenants">
            <div class='card-header'>
                <div>
                    <div class='row'>
                        <div class='col'>
                            <h5 class="card-title m-0">{{ownedFlatWithTenants[0].address}}</h5>
                        </div>
                        <div class='col-2'>
                            <button type="button" class="btn-close delete-btn"
                                (click)="deleteFlat(ownedFlatWithTenants[0].id)"></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="card-text">
                    <b>Tenant(s):</b>
                    <div *ngIf='ownedFlatWithTenants[1].length == 0'>No tenants</div>  
                    <div *ngFor="let tenant of ownedFlatWithTenants[1]">
                        {{tenant.firstName}} {{tenant.lastName}}
                    </div>
                </div><br>
                <a [routerLink]="['/flat-details', ownedFlatWithTenants[0].id]" class="btn btn-dark">Details</a>
            </div>
        </div>
    </div>
</div>
